  <ellipse cx="385" cy="360" rx="31" ry="39" fill="url(#eye)" stroke="#202450" stroke-width="6"/>
  <ellipse cx="263" cy="347" rx="10" ry="14" fill="white"/><ellipse cx="375" cy="347" rx="10" ry="14" fill="white"/>
  <circle cx="281" cy="374" r="6" fill="#d7f8ff"/><circle cx="393" cy="374" r="6" fill="#d7f8ff"/>
  <path d="M247 320q28-19 52 1M360 321q28-19 51 2" fill="none" stroke="#202450" stroke-width="8" stroke-linecap="round"/>
  <ellipse cx="236" cy="397" rx="28" ry="14" fill="#f29fa7" opacity=".42"/><ellipse cx="421" cy="397" rx="28" ry="14" fill="#f29fa7" opacity=".42"/>
  <path d="M310 405q8-8 17 1 9-9 19 0" fill="none" stroke="#7b5365" stroke-width="5" stroke-linecap="round"/>
  <path d="M225 384q-20 12-28-1M435 384q20 12 28-1" fill="none" stroke="#e9f8ff" stroke-width="12" stroke-linecap="round"/>

  <!-- Body and skirt -->
  <path d="M236 441c21-27 55-42 94-41 41 0 78 17 98 46l17 123c31 21 51 48 58 81-99 35-234 35-339-1 10-34 33-60 64-79z" fill="url(#dress)" stroke="#171d43" stroke-width="8" stroke-linejoin="round"/>
