  <path d="M364 189c32 5 57 28 83 63-32 8-61 2-84-18z" fill="#3d579b" stroke="#17204c" stroke-width="7" stroke-linejoin="round"/>
  <path d="M58 244q30 0 51-25M422 244q-30 0-51-25" fill="none" stroke="#f8f3f5" stroke-width="10" stroke-linecap="round"/>

  <!-- Headband loop -->
