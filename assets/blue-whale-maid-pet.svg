  <path d="M147 514q93 35 186 0" fill="none" stroke="#e3cad5" stroke-width="7" stroke-dasharray="6 8"/>
  <path d="M218 480c13 8 31 8 44 0-1 17-10 26-22 26-12 0-21-9-22-26z" fill="#628fc5"/>
  <path d="M260 485c8-3 13-8 16-15 2 11-1 19-11 23" fill="#628fc5"/>
