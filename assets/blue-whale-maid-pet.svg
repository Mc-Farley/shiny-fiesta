<svg xmlns="http://www.w3.org/2000/svg" width="640" height="720" viewBox="0 0 640 720" role="img" aria-labelledby="title desc">
  <title id="title">Sleepy blue whale maid desktop pet</title>
  <desc id="desc">A small blue-haired whale girl in a navy maid dress, sitting with her hands in her lap.</desc>
  <defs>
    <linearGradient id="hair" x1="0" y1="0" x2="0.8" y2="1"><stop stop-color="#465fa8"/><stop offset=".55" stop-color="#30477f"/><stop offset="1" stop-color="#73b9d3"/></linearGradient>
    <linearGradient id="tail" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4765ad"/><stop offset="1" stop-color="#273d79"/></linearGradient>
    <linearGradient id="dress" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#29335f"/><stop offset="1" stop-color="#171c40"/></linearGradient>
    <radialGradient id="skin" cx="42%" cy="32%"><stop stop-color="#fff9f6"/><stop offset="1" stop-color="#f3c9c8"/></radialGradient>
    <radialGradient id="eye" cx="44%" cy="30%"><stop stop-color="#bdeafa"/><stop offset=".38" stop-color="#4879c1"/><stop offset="1" stop-color="#17245d"/></radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>

  <!-- Soft grounding shadow -->
  <ellipse cx="330" cy="670" rx="204" ry="25" fill="#242851" opacity=".18" filter="url(#shadow)"/>

  <!-- Whale tail silhouette -->
  <path d="M456 421c72 16 98 62 82 119 35-7 62-35 76-69 10 45-1 79-38 99 28 4 47 17 58 39-48 14-86 7-111-22-24 39-65 54-118 36z" fill="url(#tail)" stroke="#17224c" stroke-width="7" stroke-linejoin="round"/>
  <path d="M505 485c22 31 21 65-4 102" fill="none" stroke="#789bd1" stroke-width="7" stroke-linecap="round" opacity=".55"/>

  <!-- Back hair and whale-fin locks -->
  <path d="M191 283c-48 30-61 83-30 125-31 10-50 29-59 57 40 7 70-1 91-27-11 45 3 80 43 104l205 6c53-31 67-83 43-133 31 5 58-4 81-29-36-3-62-22-81-56-28-74-211-109-293-47z" fill="url(#hair)" stroke="#19234e" stroke-width="8" stroke-linejoin="round"/>
  <path d="M184 323c-30-2-56 12-78 42 31 7 57 4 79-10M473 318c31 7 57 29 81 66-34 7-63 1-86-18" fill="#30477f" stroke="#19234e" stroke-width="8" stroke-linejoin="round"/>
  <path d="M205 418c-12 55 4 92 48 114M431 407c24 49 14 91-27 126" fill="none" stroke="#75b8d3" stroke-width="11" stroke-linecap="round" opacity=".75"/>

  <!-- Headband loop -->
  <path d="M298 187c-9-52 60-72 82-25 6 12 6 25 2 40" fill="none" stroke="#17224c" stroke-width="10"/>
  <path d="M305 186c-4-37 46-52 65-18 5 9 5 19 3 29" fill="none" stroke="#5c77ba" stroke-width="8"/>

  <!-- Head -->
  <ellipse cx="329" cy="342" rx="139" ry="146" fill="url(#skin)" stroke="#182149" stroke-width="8"/>
  <!-- Maid headband -->
  <path d="M205 254c13-44 58-75 119-78 64-2 113 26 135 69l-24 22-21-18-20 18-22-19-22 18-25-18-23 18-23-17-23 18-21-15-21 18z" fill="#fffaf8" stroke="#1e2855" stroke-width="7" stroke-linejoin="round"/>
  <path d="M225 253c17-31 54-52 101-54 49-2 88 16 112 45" fill="none" stroke="#e7cfd8" stroke-width="9" stroke-dasharray="8 10"/>
  <!-- Bow -->
  <path d="M440 244c20-20 36-13 34 13 25-13 35 1 18 24-22 11-42 3-54-17z" fill="#62b8d2" stroke="#1d2d60" stroke-width="6"/>
  <circle cx="449" cy="262" r="9" fill="#3b78ad"/>

  <!-- Hair cap and fringe -->
  <path d="M205 325c-6-82 47-133 123-136 83-3 140 53 136 143-31-20-52-52-61-91-15 52-37 85-66 101 1-31-6-61-22-91-16 47-45 80-88 99z" fill="url(#hair)" stroke="#19234e" stroke-width="8" stroke-linejoin="round"/>
  <path d="M239 237c23-22 51-35 84-38M349 201c37 8 65 27 84 58" fill="none" stroke="#829bd6" stroke-width="10" stroke-linecap="round" opacity=".42"/>
  <path d="M245 272c14 38 8 72-18 101M293 226c20 38 20 77 0 117M355 225c20 33 22 70 7 111M407 238c7 34 2 63-16 88" fill="none" stroke="#223566" stroke-width="5" opacity=".8"/>

  <!-- Face -->
