  <!-- Bib -->
  <path d="M286 422l43 19 43-19 28 134-70 37-72-37z" fill="#fff9f6" stroke="#202650" stroke-width="7"/>
  <path d="M280 438l49 21 50-21M329 459v107" fill="none" stroke="#e5ced7" stroke-width="5"/>
  <circle cx="329" cy="489" r="5" fill="#263264"/><circle cx="329" cy="516" r="5" fill="#263264"/>
  <!-- Neck bow -->
  <path d="M329 449c-30-31-47-18-33 15 15 12 27 9 34-4 9 15 22 17 38 3 12-35-7-43-39-14z" fill="#1d244d" stroke="#111633" stroke-width="5"/>
  <circle cx="330" cy="453" r="10" fill="#6384bd"/>
  <!-- Apron -->
  <path d="M252 535c46 25 104 25 154 0l28 99c-64 31-146 31-210 0z" fill="#fffaf8" stroke="#202650" stroke-width="7"/>
  <path d="M228 630q101 42 202 0" fill="none" stroke="#e4cdd7" stroke-width="8" stroke-dasharray="7 7"/>
  <path d="M317 585q13 10 26 0c-4 18-20 24-26 0z" fill="#5c91c8"/>
  <!-- Lap hands -->
  <path d="M211 545c11-10 28-6 36 8l25 45c7 17-5 34-22 32-15-2-24-14-22-28l-25-32c-8-10-5-20 8-25z" fill="#fffaf8" stroke="#202650" stroke-width="7"/>
  <path d="M449 545c-11-10-28-6-36 8l-25 45c-7 17 5 34 22 32 15-2 24-14 22-28l25-32c8-10 5-20-8-25z" fill="#fffaf8" stroke="#202650" stroke-width="7"/>
  <path d="M245 596c-7 13 0 24 15 27 15 3 27-6 29-20 1-13-6-22-20-24zM415 596c7 13 0 24-15 27-15 3-27-6-29-20-1-13 6-22 20-24z" fill="url(#skin)" stroke="#202650" stroke-width="6"/>
  <path d="M251 603l10 10m3-15 9 12m136-7-10 10m-3-15-9 12" stroke="#d59699" stroke-width="3" stroke-linecap="round"/>
  <!-- Lace trim and small bow -->
  <path d="M173 647q12 24 26 2 12 25 26 2 13 25 27 2 13 25 28 2 14 25 29 1 15 25 30 0 15 24 30-1 15 23 29-2 14 22 28-3 13 20 26-5 12 18 23-8" fill="none" stroke="#fffaf8" stroke-width="15" stroke-linecap="round"/>
  <path d="M430 614c17-19 32-12 25 13 22-11 30 4 12 20-19 5-33-2-40-19z" fill="#d7bd8c" stroke="#1b2148" stroke-width="5"/>

  <!-- Tiny worried marks -->
  <path d="M495 350q17-13 25 2m-14 16q16-8 20 5" fill="none" stroke="#6685ad" stroke-width="6" stroke-linecap="round"/>
</svg>
