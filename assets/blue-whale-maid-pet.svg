  <path d="M193 359l47 20 47-20M240 378v76" fill="none" stroke="#dfc7d2" stroke-width="5"/>
  <circle cx="240" cy="401" r="5" fill="#283363"/><circle cx="240" cy="425" r="5" fill="#283363"/>
  <path d="M239 363c-27-30-47-16-31 16 14 11 24 8 32-4 8 13 19 15 33 3 15-32-5-45-34-15z" fill="#202650" stroke="#111532" stroke-width="5"/>
