  <path d="M106 533q12 27 27 2 13 28 28 3 14 27 29 2 15 27 31 1 15 26 31 0 16 25 32-1 15 24 30-2 15 23 29-3 14 21 27-4 13 19 24-7" fill="none" stroke="#fffaf8" stroke-width="18" stroke-linecap="round"/>
  <path d="M113 535q127 45 254 0" fill="none" stroke="#d9bdca" stroke-width="5" stroke-dasharray="6 8"/>

  <!-- Legs, socks, and shoes -->
  <path d="M187 538l4 32 34 1 3-30M292 538l-4 32-34 1-2-30" fill="url(#skin)" stroke="#1a2149" stroke-width="6"/>
  <path d="M190 554h36l-2 25h-34zM254 554h36v25h-34z" fill="#fffaf8" stroke="#1a2149" stroke-width="5"/>
  <path d="M187 570c-4 25 9 30 37 24l3-22zM293 570c4 25-9 30-37 24l-3-22z" fill="#202650" stroke="#121735" stroke-width="6"/>

  <!-- Blue side bow -->
