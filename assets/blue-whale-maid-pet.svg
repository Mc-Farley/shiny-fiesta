  <ellipse cx="174" cy="276" rx="35" ry="43" fill="url(#iris)" stroke="#17204c" stroke-width="6"/>
  <ellipse cx="306" cy="276" rx="35" ry="43" fill="url(#iris)" stroke="#17204c" stroke-width="6"/>
  <ellipse cx="163" cy="261" rx="12" ry="17" fill="white"/><ellipse cx="295" cy="261" rx="12" ry="17" fill="white"/>
  <circle cx="184" cy="291" r="7" fill="#dbf9ff"/><circle cx="316" cy="291" r="7" fill="#dbf9ff"/>
