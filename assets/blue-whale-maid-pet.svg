<svg xmlns="http://www.w3.org/2000/svg" width="480" height="600" viewBox="0 0 480 600" role="img" aria-labelledby="title desc">
  <title id="title">Blue whale maid desktop pet</title>
  <desc id="desc">A front-facing chibi whale girl with long blue hair, a navy maid dress, and a white frilled apron.</desc>
  <defs>
    <linearGradient id="hair" x1=".2" y1="0" x2=".8" y2="1"><stop stop-color="#5369ad"/><stop offset=".48" stop-color="#354b8c"/><stop offset="1" stop-color="#78bad1"/></linearGradient>
    <linearGradient id="hairDark" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#344b8c"/><stop offset="1" stop-color="#202f67"/></linearGradient>
    <linearGradient id="dress" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#303867"/><stop offset="1" stop-color="#171a3d"/></linearGradient>
    <radialGradient id="skin" cx="48%" cy="30%"><stop stop-color="#fffdfb"/><stop offset="1" stop-color="#f3d3d0"/></radialGradient>
    <radialGradient id="iris" cx="38%" cy="28%"><stop stop-color="#d9f8ff"/><stop offset=".25" stop-color="#699fe0"/><stop offset=".68" stop-color="#365ca7"/><stop offset="1" stop-color="#152557"/></radialGradient>
    <filter id="softShadow" x="-30%" y="-80%" width="160%" height="260%"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>

  <ellipse cx="240" cy="570" rx="104" ry="13" fill="#20264f" opacity=".16" filter="url(#softShadow)"/>

  <!-- Whale tail behind the body -->
  <path d="M347 380c55 18 71 57 55 103 25-5 45-24 60-53 4 37-9 64-38 78 20 7 33 20 40 39-38 4-66-7-84-34-23 27-52 39-88 34z" fill="url(#hairDark)" stroke="#18224f" stroke-width="7" stroke-linejoin="round"/>
  <path d="M370 414c18 26 18 57 0 88" fill="none" stroke="#7897cf" stroke-width="6" stroke-linecap="round" opacity=".55"/>

  <!-- Large back-hair silhouette -->
  <path d="M107 197c-43 61-43 133-10 195-27 32-38 70-32 112 22-5 40-17 55-36-2 37 12 62 43 77 9-11 15-24 18-39 12 28 33 44 64 48l12-214z" fill="url(#hair)" stroke="#17204c" stroke-width="8" stroke-linejoin="round"/>
  <path d="M373 197c43 61 43 133 10 195 27 32 38 70 32 112-22-5-40-17-55-36 2 37-12 62-43 77-9-11-15-24-18-39-12 28-33 44-64 48l-12-214z" fill="url(#hair)" stroke="#17204c" stroke-width="8" stroke-linejoin="round"/>
